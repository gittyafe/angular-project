<mat-card [class.started-lesson]="isStarted" class="lesson-card">
  <mat-card-header>
    <mat-card-title>{{ lesson.name }}</mat-card-title>
    <mat-card-subtitle>מורה: {{ lesson.teacher }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <p>מחיר: {{ lesson.price }} ₪</p>
    <p>מועד: יום {{ lesson.day }} בשעה {{ lesson.hour }}</p>
    <p>מספר מפגשים: {{ lesson.meetings }}</p>
    <p>תאריך התחלה: {{ lesson.startDate }}</p>
  </mat-card-content>
</mat-card>
