
<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>כניסה למערכת</mat-card-title>
    </mat-card-header>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <mat-form-field>
        <mat-label>שם משתמש</mat-label>
        <input matInput type="text" formControlName="username" placeholder="הכנס שם משתמש">
      </mat-form-field>

      <mat-form-field >
        <mat-label>סיסמה</mat-label>
        <input matInput type="password" formControlName="password" placeholder="הכנס סיסמה">
      </mat-form-field>

      <button mat-raised-button color="primary" 
              type="submit"
              matTooltip="לאחר לחיצה על הכפתור, תתבצע בדיקת תקינות הפרטים שהוזנו ואם הם נכונים, המשתמש ינותב "
              aria-label="כפתור התחברות">
        להתחברות
      </button>

    </form>
  </mat-card>
</div>
